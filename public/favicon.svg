<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente del cuerpo principal de la letra A -->
    <linearGradient id="apoloGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="25%" stop-color="#00c8ff" />
      <stop offset="60%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#0055ff" />
    </linearGradient>

    <!-- Resplandor cian para los nodos y la aguja central -->
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Silueta Isotipo Apolo 'A' -->
  <path
    d="M 256 50
       L 450 455
       L 335 455
       L 294 355
       L 218 355
       L 177 455
       L 62 455
       Z"
    fill="url(#apoloGradient)"
  />

  <!-- 2. Sombra y resplandor sutil en la cavidad interna de la aguja -->
  <path
    d="M 256 165
       L 226 295
       Q 256 268 286 295
       Z"
    fill="#080e1a"
    stroke="#00f0ff"
    stroke-width="3"
    filter="url(#cyanGlow)"
  />

  <!-- 3. Nodos orbitales con resplandor neón -->
  <!-- Nodo Superior (Apex) -->
  <circle cx="256" cy="162" r="10" fill="#00f0ff" opacity="0.6" filter="url(#nodeGlow)" />
  <circle cx="256" cy="162" r="7.5" fill="#080e1a" stroke="#00f0ff" stroke-width="2" />
  <circle cx="256" cy="162" r="3.5" fill="#ffffff" />

  <!-- Nodo Central (Núcleo) -->
  <circle cx="256" cy="275" r="10" fill="#00f0ff" opacity="0.6" filter="url(#nodeGlow)" />
  <circle cx="256" cy="275" r="7.5" fill="#080e1a" stroke="#00f0ff" stroke-width="2" />
  <circle cx="256" cy="275" r="3.5" fill="#ffffff" />

  <!-- Nodo Ala Izquierda -->
  <circle cx="226" cy="308" r="9" fill="#00f0ff" opacity="0.6" filter="url(#nodeGlow)" />
  <circle cx="226" cy="308" r="6.5" fill="#080e1a" stroke="#00f0ff" stroke-width="2" />
  <circle cx="226" cy="308" r="3" fill="#ffffff" />

  <!-- Nodo Ala Derecha -->
  <circle cx="286" cy="308" r="9" fill="#00f0ff" opacity="0.6" filter="url(#nodeGlow)" />
  <circle cx="286" cy="308" r="6.5" fill="#080e1a" stroke="#00f0ff" stroke-width="2" />
  <circle cx="286" cy="308" r="3" fill="#ffffff" />
</svg>
